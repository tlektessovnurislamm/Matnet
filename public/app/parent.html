<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Islands</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f7a8c">
  <link rel="icon" type="image/png" href="icons/icon-64.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body data-i18n-title="parent.title">
  <header id="topbar"></header>
  <main>
    <div class="print-only report-head"><h1 data-i18n="report.title"></h1><p id="report-date"></p></div>
    <h1 class="no-print" data-i18n="parent.title"></h1>
    <p class="no-print"><button class="btn btn-primary" id="print" data-i18n="report.print"></button></p>
    <p class="muted" data-i18n="parent.intro"></p>
    <section class="card"><div class="report-sum" id="report-sum"></div><p id="totals" class="no-print"></p><div class="table-wrap" id="table"></div></section>
    <div class="grid2">
      <section class="card"><h2 data-i18n="parent.hardTitle"></h2><ul id="hard"></ul></section>
      <section class="card no-print"><h2 data-i18n="parent.checkTitle"></h2><p id="check"></p>
        <button class="btn btn-accent" id="reset" data-i18n="parent.reset"></button><p id="reset-msg" aria-live="polite"></p></section>
    </div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/account.js"></script>
  <script src="islands/config.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/taskGenerator.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/islandKit.js"></script>
  <script src="js/explainer.js"></script>
  <script src="js/parent.js"></script>
</body>
</html>
